<style>
/* Layout concept: phone-first single column for directors opening the link from KakaoTalk.
   Navy THE CHANGE band on top, one section per screen, a sticky progress line, big thumb-size score buttons. */
:root {
  --bg:#EFF3F8; --surface:#FFFFFF; --surface2:#F5F8FC; --ink:#13233A; --ink2:#3E4C5E; --muted:#758296;
  --line:#DDE4EC; --line2:#EAEFF5; --brand:#1A3856; --accent:#E8612F; --accent-soft:#FDEDE5;
  --b1:#D03B3B; --b1s:#FBE6E6; --b2:#E8950F; --b2s:#FDF1DC; --b3:#16A34A; --b3s:#E3F5EA; --b4:#0E8F8B; --b4s:#DDF3F2;
  --shadow:0 1px 2px rgba(19,35,58,.05), 0 8px 24px rgba(19,35,58,.06);
  --f-ui:'IBM Plex Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-disp:'Outfit', 'IBM Plex Sans KR', -apple-system, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0B111A; --surface:#131B26; --surface2:#18222F; --ink:#E9EEF5; --ink2:#B9C3D1; --muted:#8290A3;
  --line:#26303D; --line2:#1D2632; --brand:#0F1F33; --accent:#E0652F; --accent-soft:#33200F;
  --b1:#EF6B6B; --b1s:#3A1A1C; --b2:#F0A93A; --b2s:#35270E; --b3:#3CC873; --b3s:#12301F; --b4:#2EC4BE; --b4s:#0F2F30;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0B111A; --surface:#131B26; --surface2:#18222F; --ink:#E9EEF5; --ink2:#B9C3D1; --muted:#8290A3;
  --line:#26303D; --line2:#1D2632; --brand:#0F1F33; --accent:#E0652F; --accent-soft:#33200F;
  --b1:#EF6B6B; --b1s:#3A1A1C; --b2:#F0A93A; --b2s:#35270E; --b3:#3CC873; --b3s:#12301F; --b4:#2EC4BE; --b4s:#0F2F30;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
button, input, select, textarea { font:inherit; color:inherit; }
h1, h2, h3 { margin:0; text-wrap:balance; }
p { margin:0; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.top { background:radial-gradient(120% 140% at 0% 0%, #2B5C8C 0%, #1A3856 45%, #0F2640 100%); color:#fff; padding:18px 16px; }
.top-in { max-width:720px; margin:0 auto; display:flex; align-items:center; gap:12px; }
.top img { width:40px; height:40px; flex:none; }
.top .t1 { font-family:var(--f-disp); font-weight:700; letter-spacing:.24em; font-size:12px; }
.top .t2 { font-weight:700; font-size:16px; }
.prog { position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 16px; }
.prog-in { max-width:720px; margin:0 auto; display:flex; align-items:center; gap:12px; font-size:13px; color:var(--ink2); }
.prog .bar { flex:1; height:6px; background:var(--line2); border-radius:99px; overflow:hidden; }
.prog .bar i { display:block; height:100%; background:linear-gradient(90deg, var(--accent), #F2A03D); border-radius:99px; transition:width .25s; }
.wrap { max-width:720px; margin:0 auto; padding:20px 16px 120px; display:flex; flex-direction:column; gap:16px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:var(--shadow); min-width:0; }
.eyebrow { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; }
h1 { font-size:24px; line-height:1.35; }
h2 { font-size:19px; }
.lead { color:var(--ink2); margin-top:8px; }
.muted { color:var(--muted); }
.list { display:flex; flex-direction:column; gap:10px; margin:14px 0 0; padding:0; list-style:none; }
.list li { display:flex; gap:10px; align-items:flex-start; }
.list li b { flex:none; width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:13px; }
.choice { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
@media (max-width: 420px) { .choice { grid-template-columns:1fr; } }
.choice button { text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:14px; cursor:pointer; }
.choice button b { display:block; font-size:16px; }
.choice button span { font-size:13px; color:var(--muted); }
.choice button[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-soft); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns:1fr; } }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field label { font-size:13.5px; font-weight:600; color:var(--ink2); }
.field .u { font-weight:400; color:var(--muted); }
.in { width:100%; min-height:48px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:16px; }
textarea.in { min-height:84px; resize:vertical; }
.in:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.toggle { display:flex; align-items:center; gap:10px; min-height:44px; font-size:15px; }
.toggle input { width:22px; height:22px; accent-color:var(--accent); }
.sec-h { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
.q { border-top:1px solid var(--line2); padding-top:16px; margin-top:16px; }
.q:first-of-type { border-top:0; padding-top:0; margin-top:14px; }
.q .no { font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.06em; }
.q .tx { font-size:17px; font-weight:600; margin:2px 0 10px; line-height:1.5; }
.pad { display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:6px; }
@media (max-width: 560px) { .pad { grid-template-columns:repeat(5, minmax(0,1fr)); } }
.pad button { min-height:48px; border-radius:11px; border:1px solid var(--line); background:var(--surface); font-family:var(--f-disp); font-weight:700; font-size:18px; cursor:pointer; position:relative; overflow:hidden; }
.pad button::after { content:''; position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--bc); }
.pad button[aria-pressed="true"] { background:var(--bc); border-color:var(--bc); color:#fff; }
.c1 { --bc:var(--b1); } .c2 { --bc:var(--b2); } .c3 { --bc:var(--b3); } .c4 { --bc:var(--b4); }
.na { margin-top:8px; border:0; background:none; color:var(--muted); font-size:13.5px; padding:6px 0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.na[aria-pressed="true"] { color:var(--ink); font-weight:700; }
.scale { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:12px; font-size:13px; }
.scale div { border-radius:10px; padding:10px; background:var(--surface2); }
.scale b { font-family:var(--f-disp); font-size:16px; display:block; }
.foot { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.foot-in { max-width:720px; margin:0 auto; display:flex; gap:10px; }
.btn { flex:1; min-height:52px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:16px; cursor:pointer; }
.btn.pri { background:var(--brand); border-color:var(--brand); color:#fff; }
.btn.acc { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn[disabled] { opacity:.4; cursor:default; }
.code { width:100%; min-height:140px; font-family:ui-monospace, Menlo, monospace; font-size:12px; word-break:break-all; }
.done-ring { display:flex; align-items:center; gap:16px; margin-top:14px; }
.note { font-size:13.5px; color:var(--ink2); background:var(--surface2); border-radius:12px; padding:12px 14px; }
.toast { position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:10px; font-weight:600; font-size:14px; z-index:50; max-width:calc(100vw - 32px); }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<script>
/* THE CHANGE DIAGNOSIS 200 — DIAGNOSTIC ENGINE
 * Pure, deterministic functions. Every finding carries its evidence basis and a confidence
 * label; anything without data is marked "추가 확인 필요" instead of being guessed.
 * SCORE → GAP → PROBLEM → ROOT CAUSE → PRIORITY → PRESCRIPTION → ACTION → KPI
 */
(function (root) {

const num = v => (v === '' || v === null || v === undefined || isNaN(+v)) ? null : +v;
const r1 = v => v == null ? null : Math.round(v * 10) / 10;

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const won = v => v == null ? '—' : Math.round(v).toLocaleString('ko-KR') + '원';

/* ---------- configuration merge (admin overrides) ---------- */
function config(cfg) {
  cfg = cfg || {};
  const weights = Object.assign({}, Object.fromEntries(DOMAINS.map(d => [d.id, d.weight])), cfg.weights || {});
  const qo = cfg.q || {};
  const questions = QUESTIONS.map(q => {
    const o = qo[q.question_id];
    if (!o) return q;
    const m = Object.assign({}, q, o);
    if (o.observation_standard) m.observation_standard = Object.assign({}, q.observation_standard, o.observation_standard);
    return m;
  }).concat(Object.values(cfg.custom || {}));
  const pres = Object.assign({}, PRES);
  Object.entries(cfg.pres || {}).forEach(([k, v]) => { pres[k] = Object.assign([], PRES[k] || [], v); });
  const kpis = Object.assign({}, KPIS);
  Object.entries(cfg.kpi || {}).forEach(([k, v]) => { kpis[k] = Object.assign({}, KPIS[k] || {}, v); });
  return { weights, questions, pres, kpis };
}

/* ---------- adaptive context ---------- */
function context(dojo) {
  const p = (dojo && dojo.profile) || {};
  let months = null;
  if (p.startDate) { const s = new Date(p.startDate); if (!isNaN(s)) months = Math.max(0, Math.round((Date.now() - s) / (30.44 * 864e5))); }
  const staff = (num(p.instructors) || 0);
  return {
    vehicle: !!p.hasVehicle, adult: !!p.hasAdult, noAdult: !p.hasAdult,
    solo: staff > 0 && staff <= 1, acquired: p.openType === '기존도장 인수',
    newOpen: months !== null && months < 12, months,
  };
}

function visibleQuestions(C, dojo, mode) {
  const x = context(dojo);

  C.questions.forEach(q => {
    if (q.active === false) return;
    if (mode === 'EXPRESS' && !q.express) return;

    if (c === 'vehicle' && !x.vehicle) return;

  return list;

/* ---------- metrics from profile numbers ---------- */
function metrics(profile) {
  const p = profile || {};

  const n = k => num(p[k]);

  const fixedParts = ['rent', 'labor', 'vehicleCost', 'mgmtCost', 'adCost', 'otherFixed'].map(n);

  m.variableCost = n('variableCost');

  const perMemberVar = (m.variableCost != null && m.members) ? m.variableCost / m.members : 0;
  const fee = m.avgFee || m.arpu;
  m.bep = (m.fixedCost != null && fee) ? Math.ceil(m.fixedCost / Math.max(1, fee - perMemberVar)) : null;
  m.bepMargin = (m.bep && m.members) ? Math.round((m.members / m.bep - 1) * 1000) / 10 : null;
  m.inquiries = n('inquiries'); m.consults = n('consults'); m.enrollments = n('enrollments');
  m.contactRate = pct(m.consults, m.inquiries);
  m.convRate = pct(m.enrollments, m.consults);

  m.visitRate = n('visitRate');
  m.newMembers = n('newMembers'); m.churn = n('churnMonthly'); m.pause = n('pauseMonthly');
  m.churnRate = (m.churn != null && m.members) ? Math.round(m.churn / m.members * 1000) / 10 : null;
  m.churnLoss = (m.churn != null && fee) ? m.churn * fee : null;
  m.netGrowth = (m.newMembers != null && m.churn != null) ? m.newMembers - m.churn : null;
  m.retention3m = n('retention3m'); m.retention6m = n('retention6m'); m.retention12m = n('retention12m');
  m.referralRate = n('referralRate'); m.parentSat = n('parentSat'); m.adCost = n('adCost');
  m.cac = (m.adCost != null && m.newMembers) ? Math.round(m.adCost / m.newMembers) : null;
  m.inqPerMember = (m.inquiries != null && m.members) ? m.inquiries / m.members : null;
  return m;
}

    if (m.churnRate >= 3) out.push({ id: 'churn', level: 'HIGH', text: `월 퇴관 ${m.churn}명 (퇴관율 ${m.churnRate}%)${loss}`, insight: '매월 발생하는 퇴관 손실이 신규 획득 효과를 상쇄하고 있습니다.', primary: ['CUS-03'], affects: ['CUS-03', 'FIN-06', 'SAL-05'], urgency: 5, kpi: 'K_CHURN' });
  }
  if (m.netGrowth != null && m.netGrowth <= 0) out.push({ id: 'net', level: 'HIGH', text: `월 신규 ${m.newMembers}명 − 퇴관 ${m.churn}명 = 순증 ${m.netGrowth}명`, insight: '신규관원이 퇴관을 넘지 못해 관원수가 정체 또는 감소하는 구조입니다.', primary: ['CUS-01'], affects: ['CUS-01', 'CUS-02', 'FIN-05', 'FIN-06'], urgency: 4, kpi: 'K_NEW' });
  if (m.bep != null && m.members != null) {
    const t = `손익분기 관원수 약 ${m.bep}명 · 현재 ${m.members}명 (여유 ${m.bepMargin}%)`;
    if (m.bepMargin < 15) out.push({ id: 'bep', level: 'HIGH', text: t, insight: '손익분기점 대비 여유가 작아 퇴관 몇 명에도 적자 전환 위험이 있습니다.', primary: ['FIN-03'], affects: ['FIN-03', 'FIN-01', 'FIN-02'], urgency: 5, kpi: 'K_BEP' });
    else out.push({ id: 'bep-ok', level: 'INFO', text: t, insight: '손익분기점 대비 안전 여유를 확보하고 있습니다.', affects: [], urgency: 0 });
  } else checks.push({ topic: '손익분기', text: '고정비 또는 평균 회비 데이터가 없어 손익분기점을 계산할 수 없습니다.', need: '월세·인건비·차량비·관리비·광고비·평균 회비' });
  if (m.retention12m == null) checks.push({ topic: '장기 유지율', text: '12개월 유지율 데이터가 없습니다. 장기 수련생 특성 분석은 확정할 수 없습니다.', need: '12개월 전 재원 명단' });
  if (m.parentSat == null) checks.push({ topic: '학부모 만족도', text: '학부모 만족도 측정 데이터가 없어 만족도를 퇴관 원인으로 단정할 수 없습니다.', need: '학부모 만족도 설문 (5문항)' });
  return { list: out, checks };
}

/* ---------- confidence of evidence ---------- */
const CONF = {
  CONFIRMED: { ko: '전문가 직접 확인', rank: 5 }, OBSERVED: { ko: '현장 관찰', rank: 4 }, DATA: { ko: '숫자 데이터', rank: 4 },
  'SELF-REPORTED': { ko: '관장님 진술', rank: 2 }, INFERRED: { ko: 'AI 분석(미확정)', rank: 1 },
};

/* ---------- DIAGNOSE ---------- */
function diagnose(input) {
  const C = config(input.cfg);
  const dojo = input.dojo || {}, profile = dojo.profile || {};
  const mode = (input.diag && input.diag.mode) || 'FULL';
  const qs = visibleQuestions(C, dojo, mode);
  const S = scores(C, qs, input.self, input.expert, profile);
  const m = metrics(profile);
  const P = patterns(m, profile);
  const evidence = (input.evidence || []).filter(e => !e.rejected);
  const evByQ = {};
  evidence.forEach(e => { if (e.qid) (evByQ[e.qid] = evByQ[e.qid] || []).push(e); });

  /* problems */
  const groups = {};
  S.items.forEach(it => {
    if (it.ref || it.na) return;
    const pc = it.q.problem_code;
    const g = groups[pc] = groups[pc] || { code: pc, items: [], low: [] };
    g.items.push(it);
    const lowByExpert = it.e != null && it.e <= 5;
    const lowBySelf = it.e == null && it.s != null && it.s <= 4;
    if (lowByExpert || lowBySelf || (it.dataGap && (it.e == null || it.e <= 6))) g.low.push(it);
  });
  const urg = {}, prim = {};
  P.list.forEach(p => {
    (p.affects || []).forEach(c => { urg[c] = Math.max(urg[c] || 0, (p.primary || []).includes(c) ? p.urgency : Math.max(0, p.urgency - 1)); });
    (p.primary || []).forEach(c => { prim[c] = true; });
  });

  const problems = Object.values(groups).filter(g => g.low.length).map(g => {
    const pc = g.code, pres = C.pres[pc] || ['처방 정의 필요', 3, '관장', 'K_EXEC', [], ''];
    const eVals = g.items.map(i => i.e).filter(v => v != null), sVals = g.items.map(i => i.s).filter(v => v != null);
    const avgE = r1(avg(eVals)), avgS = r1(avg(sVals));
    const avgImp = avg(g.low.map(i => +i.q.impact || 1));
    const dw = +C.weights[g.items[0].q.domain] || 10;
    const impact = clamp(r1(1 + (avgImp - 1) * 1.5 + (dw >= 15 ? 0.3 : 0) + (g.low.length >= 3 ? 0.5 : 0) + (prim[pc] ? 0.7 : 0)), 1, 5);
    const scoreBase = avgE != null ? avgE : (avgS != null ? avgS : 5);
    let urgency = scoreBase <= 3 ? 4 : scoreBase <= 4.5 ? 3.5 : 3;
    if (urg[pc]) urgency = Math.max(urgency, urg[pc]);
    const evs = g.items.flatMap(i => evByQ[i.q.question_id] || []);
    const hasExpert = eVals.length > 0;
    const confirmedEv = evs.filter(e => e.confidence === 'CONFIRMED' || e.confidence === 'OBSERVED' || e.confidence === 'DATA');
    const dataBacked = !!urg[pc];
    let conf = hasExpert ? 3 : 1;
    if (confirmedEv.length) conf += 1;
    if (dataBacked) conf += 1;
    const needsCheck = [];
    const reqMissing = g.low.filter(i => i.q.evidence_required && !(evByQ[i.q.question_id] || []).length);
    if (reqMissing.length) { conf -= 0.5; needsCheck.push(`${reqMissing.map(i => i.q.question_id).join(', ')}: 필수 증거(${reqMissing[0].q.evidence_type}) 미첨부`); }
    if (!hasExpert) needsCheck.push('전문가 현장 평가 전 — 관장님 자기진단만으로 판단됨');
    const dgs = g.low.filter(i => i.dataGap);
    if (dgs.length) needsCheck.push(`${dgs.map(i => i.q.question_id).join(', ')}: DATA GAP (숫자 없음)`);
    conf = clamp(r1(conf), 1, 5);
    const difficulty = +pres[1] || 3;
    const priority = r1(impact * urgency * conf / difficulty);
    /* root causes weighting */
    const rcw = {};
    g.low.forEach(i => {
      const rcs = String(i.q.root_cause_code || '').split(',').map(s => s.trim()).filter(Boolean);
      const sev = (i.e != null ? 6 - i.e : i.s != null ? 5 - i.s : 2) + (i.dataGap ? 1 : 0);
      rcs.forEach((rc, k) => { rcw[rc] = (rcw[rc] || 0) + Math.max(0.5, sev) * (+i.q.impact || 1) * (k === 0 ? 1 : 0.6); });
    });
    const rcs = Object.entries(rcw).sort((a, b) => b[1] - a[1]).map(([id, w]) => ({ id, w: r1(w), ...ROOT_CAUSES[id] }));
    const gap = (avgS != null && avgE != null) ? r1(avgE - avgS) : null;
    const pat = P.list.filter(p => (p.affects || []).includes(pc)).sort((a, b) => ((b.primary || []).includes(pc) ? 1 : 0) - ((a.primary || []).includes(pc) ? 1 : 0));
    /* reasons */
    const reasons = [];
    if (pat.length) reasons.push(pat[0].insight);
    if (avgE != null) reasons.push(`관련 ${g.items.length}개 문항 전문가 평균 ${avgE}점, 그중 ${g.low.length}개 문항이 우선 개선 영역`);
    else if (avgS != null) reasons.push(`관장님 자기진단 평균 ${avgS}점 (전문가 평가 전)`);
    if (gap != null && gap <= -1.5) reasons.push(`관장님 인식(${avgS})과 현장 관찰(${avgE}) 사이 PERCEPTION GAP ${gap}`);
    if (difficulty <= 2) reasons.push('실행 난이도가 낮아 단기간에 측정 가능한 KPI 변화가 가능');
    else if (difficulty >= 4) reasons.push('실행 난이도가 높아 단계적 접근 필요');
    const kpiId = pres[3];
    return {
      code: pc, name: PROBLEMS[pc] || pc, domain: g.items[0].q.domain, items: g.items, low: g.low,
      avgE, avgS, gap, impact, urgency, confidence: conf, difficulty, priority,
      confidenceLabel: conf >= 4 ? 'CONFIRMED' : conf >= 3 ? 'OBSERVED' : conf >= 2 ? 'SELF-REPORTED' : 'INFERRED',
      rootCauses: rcs, patterns: pat, reasons, needsCheck,
      prescription: { code: 'PRES-' + pc, title: pres[0], difficulty, owner: pres[2], kpi: kpiId, acts: pres[4] || [], resource: pres[5] || '' },
      kpi: kpiId, evidence: evs, primary: !!prim[pc],
    };
  }).sort((a, b) => b.priority - a.priority || (a.avgE ?? 10) - (b.avgE ?? 10));

  /* suggested prescriptions: top 3 by priority with distinct KPI */
  const suggested = [], usedK = new Set();
  problems.forEach(p => { if (suggested.length < 3 && !usedK.has(p.kpi)) { suggested.push(p.code); usedK.add(p.kpi); } });

  /* global root causes */
  const rcAgg = {};
  problems.forEach(p => p.rootCauses.forEach(rc => {
    const a = rcAgg[rc.id] = rcAgg[rc.id] || { id: rc.id, ko: rc.ko, desc: rc.desc, w: 0, problems: [] };
    a.w += rc.w * (p.priority / 10 + 0.5); a.problems.push(p.code);
  }));
  const rootCauses = Object.values(rcAgg).sort((a, b) => b.w - a.w).map(r => Object.assign(r, { w: r1(r.w) }));

  /* strengths */
  const doms = Object.values(S.domains).filter(d => d.current != null).sort((a, b) => b.current - a.current);
  const strongItems = S.items.filter(i => i.e != null && i.e >= 8).sort((a, b) => b.e - a.e);
  const strengths = doms.slice(0, 3).map(d => ({ domain: d.id, ko: d.ko, score: d.current, items: strongItems.filter(i => i.q.domain === d.id).slice(0, 3) }));
  const hidden = S.items.filter(i => i.type === 'B').sort((a, b) => b.gap - a.gap).slice(0, 5);

  /* gaps */
  const gapDomains = Object.values(S.domains).filter(d => d.gap != null).sort((a, b) => a.gap - b.gap);
  const gapItems = S.items.filter(i => i.gap != null).sort((a, b) => a.gap - b.gap);
  const biggestGap = gapDomains[0] && gapDomains[0].gap < 0 ? gapDomains[0] : null;
  const dataGaps = S.items.filter(i => i.dataGap && !i.ref);

  /* critical issue */
  const critical = problems.find(p => (p.avgE ?? p.avgS ?? 10) <= 5.5 && p.impact >= 3 && p.confidence >= 3) || problems[0] || null;

  /* health */
  const cur = S.overall.current;
  const minDom = doms.length ? doms[doms.length - 1] : null;
  const severe = problems.filter(p => (p.avgE ?? 10) <= 4 && p.impact >= 3).length;
  const dataConf = S.total ? r1((S.answeredE / S.total) * 5 - dataGaps.length / Math.max(1, S.total) * 5 + 0.0001) : 0;
  let health = 'GROWTH'; const hr = [];
  if (cur == null) { health = null; }
  else if (cur < 55 || severe >= 3) { health = 'TRANSFORMATION'; hr.push(cur < 55 ? `종합점수 ${cur}` : `핵심 영역 ${severe}곳 동시 개선 필요`); }
  else if ((minDom && minDom.current < 55) || (critical && critical.priority >= 8)) { health = 'ATTENTION'; if (minDom && minDom.current < 55) hr.push(`${minDom.ko} ${minDom.current}점`); if (critical) hr.push(`CRITICAL: ${critical.name}`); }
  else if (cur < 80) { health = 'GROWTH'; hr.push('뚜렷한 위기 영역 없이 성장 여지가 큼'); }
  else { health = 'STABLE'; hr.push('핵심 영역이 시스템으로 작동'); }
  if (biggestGap && biggestGap.gap <= -2) hr.push(`${biggestGap.ko} PERCEPTION GAP ${biggestGap.gap}`);
  if (S.expertCoverage < 0.5) hr.push('전문가 평가 비율 50% 미만 — 추가 확인 필요');
  if (dataGaps.length >= 5) hr.push(`DATA GAP ${dataGaps.length}개 문항`);
  const HEALTH = {
    STABLE: '현재 시스템이 안정적으로 작동하고 있습니다.', GROWTH: '성장 가능성이 큰 상태입니다.',
    ATTENTION: '일부 핵심영역의 우선 개선이 필요합니다.', TRANSFORMATION: '핵심 구조를 변화시킬 필요가 있습니다.',
  };

  /* root-cause chains for top problems */
  const chains = problems.slice(0, 5).map(p => chain(p, evByQ));

  /* summary (7 outputs) */
  const top = suggested.map(c => problems.find(p => p.code === c));
  const summary = {
    current: cur == null ? NEED : `CHANGE SCORE ${cur} (${S.overall.basis === 'EXPERT' ? '전문가 평가 기준' : '자기진단 기준 — 전문가 평가 전'}). 상태: ${health}. ${HEALTH[health] || ''}`,
    strength: strengths[0] ? `가장 강한 영역은 ${strengths[0].ko} ${strengths[0].score}점${strengths[0].items.length ? ` (${strengths[0].items.map(i => i.q.question_id).join(', ')})` : ''}.${hidden.length ? ` 관장님이 낮게 평가했지만 현장에서 확인된 강점 ${hidden.length}개 문항.` : ''}` : NEED,
    gap: biggestGap ? `가장 큰 PERCEPTION GAP은 ${biggestGap.ko}: 관장님 자기평가 ${biggestGap.selfAvg} · 전문가 평가 ${biggestGap.expertAvg} · GAP ${biggestGap.gap}.` + (dataGaps.length ? ` DATA GAP ${dataGaps.length}개 문항.` : '') : (S.overall.gap == null ? `자기진단과 전문가 진단이 모두 입력되어야 계산됩니다 — ${NEED}` : '큰 인식 차이는 확인되지 않았습니다.'),
    problem: critical ? `CRITICAL ISSUE: ${critical.name} (${critical.code}) — ${critical.reasons[0] || ''}` : '우선 개선 영역이 확인되지 않았습니다.',
    rootCause: rootCauses[0] ? `${rootCauses[0].id} ${rootCauses[0].ko} — ${rootCauses[0].desc}${critical && critical.confidence < 3 ? ` (근거 부족: ${NEED})` : ''}` : NEED,
    prescription: top.length ? top.map((p, i) => `${i + 1}. ${p.prescription.code} ${p.prescription.title}`).join(' / ') : '—',
    action: top[0] ? `THE CHANGE 100 DAY 1–30: ${top[0].prescription.acts.slice(0, 2).join(' → ')} · 핵심 KPI ${C.kpis[top[0].kpi] ? C.kpis[top[0].kpi].ko : top[0].kpi}` : '—',
  };
  return {
    C, qs, scores: S, metrics: m, suggested, comp: composition(profile), patterns: P.list, checks: P.checks, problems, rootCauses, strengths, hidden,
    gapDomains, gapItems, biggestGap, dataGaps, critical, health, healthText: HEALTH[health] || '', healthReasons: hr,
    dataConfidence: clamp(dataConf, 0, 5), chains, summary, evByQ,
  };
}

function chain(p, evByQ) {
  const obs = [];
  p.low.forEach(i => {
    if (i.note) obs.push(`${i.q.question_id} 전문가 메모: ${i.note}`);
    (evByQ[i.q.question_id] || []).forEach(e => { if (e.observation) obs.push(`${i.q.question_id} ${e.type === 'video' ? '영상' : e.type === 'photo' ? '사진' : e.type === 'voice' ? '음성' : '메모'}(${e.confidence}): ${e.observation}`); });
  });
  const lowTxt = p.low.slice(0, 4).map(i => `${i.q.question_id}(${i.e != null ? '전문가 ' + i.e : '자기 ' + i.s})`).join(', ');
  const rc = p.rootCauses[0];
  return {
    code: p.code,
    SYMPTOM: p.patterns[0] ? p.patterns[0].text : `${p.name} 관련 문항 점수 저하`,
    DATA: p.patterns.length ? p.patterns.map(x => x.text).join(' / ') : `관련 숫자 데이터 없음 — ${NEED}`,
    OBSERVATION: obs.length ? obs.slice(0, 3).join(' / ') : `현장 관찰 기록 없음 — ${NEED}`,
    PATTERN: `${lowTxt}${p.gap != null ? ` · PERCEPTION GAP ${p.gap}` : ''}`,
    POSSIBLE_CAUSE: p.rootCauses.slice(0, 3).map(r => `${r.id} ${r.ko}`).join(', ') || NEED,
    ROOT_CAUSE: rc ? `${rc.id} ${rc.ko} — ${rc.desc}${p.confidence < 3 ? ` (가능성 · ${NEED})` : ''}` : NEED,
    PRIORITY: `Impact ${p.impact} × Urgency ${p.urgency} × Confidence ${p.confidence} ÷ Difficulty ${p.difficulty} = ${p.priority}`,
    PRESCRIPTION: `${p.prescription.code} ${p.prescription.title}`,
  };
}

/* ---------- per-question analysis (INFERRED; expert approves) ---------- */
function questionAnalysis(q, s, e, note, evs, nodata) {
  const v = e != null ? e : s;
  if (v == null) return null;
  const b = band(v);
  const rcs = String(q.root_cause_code || '').split(',').filter(Boolean).map(r => `${r} ${ROOT_CAUSES[r] ? ROOT_CAUSES[r].ko : ''}`);
  const flags = [];
  if (s != null && e != null && Math.abs(e - s) >= 3) flags.push(`PERCEPTION GAP ${e - s > 0 ? '+' : ''}${e - s}`);
  if (q.evidence_required && !(evs || []).length) flags.push(`필수 증거(${q.evidence_type}) 미첨부 — ${NEED}`);
  if (nodata) flags.push('DATA GAP — 숫자 없음');
  if (e == null) flags.push('전문가 평가 전 (관장님 진술 기준)');
  const pres = PRES[q.problem_code];
  return {
    OBSERVATION: note || ((evs || []).find(x => x.observation) || {}).observation || `관찰 메모 없음 — ${NEED}`,
    CURRENT_STATE: `${v}점 · ${b ? b.text : ''}`,
    RISK: v <= 3 ? `${PROBLEMS[q.problem_code]} 영역 잠재적 손실 — ${KPIS[q.kpi] ? KPIS[q.kpi].ko : q.kpi}에 직접 영향` : v <= 5 ? `${PROBLEMS[q.problem_code]} 표준화 필요` : v <= 7 ? '시스템은 작동 중 — 측정·개선 주기 보완' : '강점 — 유지 및 다른 영역으로 확장',
    POSSIBLE_CAUSE: v <= 6 ? rcs.join(', ') : '—',
    RECOMMENDATION: v <= 6 && pres ? `PRES-${q.problem_code} ${pres[0]}` : '현재 수준 유지 · 정기 측정',
    flags,
  };
}

/* ---------- KPI baseline / target ---------- */
function kpiBaseline(id, m) {
  const map = {
    K_REV: m.revenue, K_OP: m.profit, K_BEP: m.bepMargin, K_ARPU: m.arpu, K_MEM: m.members, K_NEW: m.newMembers,
    K_CHURN: m.churnRate, K_RET3: m.retention3m, K_RET6: m.retention6m, K_RET12: m.retention12m, K_REF: m.referralRate,
    K_PSAT: m.parentSat, K_INQ: m.inquiries, K_CONTACT: m.contactRate, K_VISIT: m.visitRate, K_CONV: m.convRate,
  };
  const v = map[id];
  return v == null ? null : v;
}
function kpiTarget(id, base, kpis) {
  const k = (kpis || KPIS)[id]; if (!k || !k.target) return null;
  const [op, val] = k.target;
  let t;
  if (op === 'set') t = val;
  else if (base == null) return null;
  else if (op === 'add') t = base + val;
  else if (op === 'mul') t = base * val;
  if (k.unit === '%') t = Math.min(100, t);
  if (k.unit === '/10') t = Math.min(10, t);
  if (k.unit === '원') return Math.round(t / 10000) * 10000;
  return Math.round(t * 10) / 10;
}
function fmtKpi(id, v, kpis) {
  const k = (kpis || KPIS)[id];
  if (v == null || v === '') return '—';
  if (!k) return String(v);
  if (k.unit === '원') return Math.round(v).toLocaleString('ko-KR') + '원';
  if (k.unit === '%') return (Math.round(v * 10) / 10) + '%';
  return (Math.round(v * 10) / 10) + (k.unit.startsWith('/') ? k.unit : k.unit);
}

/* ---------- THE CHANGE 100 ---------- */
const PHASES = [
  { id: 'P1', d: [1, 7], ko: '문제 정의 / 데이터 정리' },
  { id: 'P2', d: [8, 14], ko: '첫 번째 처방 실행' },
  { id: 'P3', d: [15, 30], ko: '실행 안정화' },
  { id: 'P4', d: [31, 60], ko: '성과 측정' },
  { id: 'P5', d: [61, 90], ko: '개선 및 확장' },
  { id: 'P6', d: [91, 100], ko: '재진단 / 표준화' },
];
const GRID = [

    <p class="muted" style="font-size:13px;margin-top:8px">복사 버튼이 안 되면 위 칸을 길게 눌러 전체 선택 → 복사해 주세요.</p></div>
    <div class="card"><h2 style="font-size:16px">수정하고 싶으신가요?</h2><p class="lead" style="font-size:14px">이전 버튼으로 돌아가 고친 뒤 다시 복사해서 보내주시면 됩니다.</p></div>`;
    f.innerHTML = `<div class="foot-in"><button class="btn" data-act="dom" data-v="${domainsWithQs().length - 1}">이전</button><button class="btn acc" data-act="copy">결과 복사</button></div>`;
    buildCode().then(t => { const el = document.getElementById('code'); if (el) el.value = t; });
  }
}

/* ---------- result code ---------- */
function encodeAnswers() {
  return QUESTIONS.map(q => { const a = S.a[q.question_id]; return a == null ? '0' : a === 'N' ? 'N' : a === 10 ? 'X' : String(a); }).join('');
}
function b64url(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
async function buildCode() {
  const p = {}; Object.entries(S.p).forEach(([k, v]) => { if (v !== '' && v != null) p[k] = v; });
  const payload = { v: 1, t: new Date().toISOString(), mode: S.mode, p, i: S.i, a: encodeAnswers() };
  const raw = new TextEncoder().encode(JSON.stringify(payload));
  let code;
  try {
    if (typeof CompressionStream === 'undefined') throw 0;
    const cs = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    code = 'TC1.' + b64url(new Uint8Array(await new Response(cs).arrayBuffer()));
  } catch (e) { code = 'TC0.' + b64url(raw); }
  const n = answered(qs());
  return `[THE CHANGE 사전 자기진단]\n도장: ${S.p.name || '—'}\n관장: ${S.p.director || '—'}\n체크: ${n}/${qs().length}문항 (${S.mode === 'EXPRESS' ? '핵심 50' : '전체 200'})\n\n아래 코드를 그대로 보내주세요.\n${code}`;
}
function toast(m) { const t = document.getElementById('toast'); t.innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toast.h); toast.h = setTimeout(() => t.innerHTML = '', 2600); }

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'mode') { S.mode = v; save(); render(); }
  else if (a === 'go') go(v, b.dataset.d != null ? +b.dataset.d : null);
  else if (a === 'dom') go('questions', +v);
  else if (a === 'score') {
    const cur = S.a[b.dataset.q]; const nv = v === 'N' ? 'N' : +v;
    if (cur === nv) delete S.a[b.dataset.q]; else S.a[b.dataset.q] = nv;
    save(); const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  else if (a === 'copy') {
    const el = document.getElementById('code');
    try { await navigator.clipboard.writeText(el.value); toast('복사했습니다. 카카오톡에 붙여넣어 보내주세요.'); }
    catch (x) { el.focus(); el.select(); el.setSelectionRange(0, el.value.length); toast('전체 선택했습니다. 복사해서 보내주세요.'); }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.p) { const k = el.dataset.p; S.p[k] = el.type === 'checkbox' ? el.checked : (el.dataset.num && el.value !== '' ? +el.value : el.value); save(); }
  else if (el.dataset.pr != null) { S.i.problems3[+el.dataset.pr] = el.value; save(); }
  else if (el.dataset.i) { S.i[el.dataset.i] = el.value; save(); }
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset.p) { S.p[el.dataset.p] = el.type === 'checkbox' ? el.checked : (el.dataset.num && el.value !== '' ? +el.value : el.value); save(); } });
render();
})();
</script>
